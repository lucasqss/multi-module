quarkus.datasource.db-kind=oracle

# O schema é responsabilidade do Flyway (migrations no jpa-core); o Hibernate só confere o mapeamento
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# Entrega: UM jar executável com todos os módulos e dependências, direto no target/ da raiz
# (o diretório é relativo a target/biblioteca-app/). Rodar com: java -jar target/biblioteca.jar
quarkus.package.jar.type=uber-jar
quarkus.package.output-directory=..
quarkus.package.output-name=biblioteca
quarkus.package.jar.add-runner-suffix=false
