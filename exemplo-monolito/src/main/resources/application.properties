# --- Nosso banco (schema APP), versionado pelo Flyway ---
quarkus.datasource.db-kind=oracle
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration/nucleo,db/migration/garantia,db/migration/modalidade/imovel,db/migration/modalidade/servico,db/migration/integracao

# --- Core de consórcio: só leitura de views e chamada de procedure ---
# Sem transação gerenciada: a chamada ao core nunca participa da transação do nosso banco.
quarkus.datasource."core".db-kind=oracle
quarkus.datasource."core".devservices.enabled=false
quarkus.datasource."core".jdbc.transactions=disabled

# --- Sistemas externos ---
quarkus.rest-client.pagamentos.url=http://localhost:9001
quarkus.rest-client.ged.url=http://localhost:9002

# --- Outbox ---
outbox.intervalo=5s
outbox.max-tentativas=5
%test.quarkus.scheduler.enabled=false
