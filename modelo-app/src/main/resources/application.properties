# Configuração da aplicação: só o módulo do app deve ter application.properties.
# Sobrescreve o @WithDefault declarado no modelo-core.
modelo.saudacao.prefixo=Olá

# Entrega: UM jar executável com todos os módulos e dependências, direto no target/ da raiz
# (o diretório é relativo a target/modelo-app/). Rodar com: java -jar target/modelo.jar
quarkus.package.jar.type=uber-jar
quarkus.package.output-directory=..
quarkus.package.output-name=modelo
quarkus.package.jar.add-runner-suffix=false
