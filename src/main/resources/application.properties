quarkus.http.port=8081
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:pagamento;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Fuso do negócio: define o que é "hoje" (não depende do fuso do servidor)
pagamento.fuso-horario=America/Sao_Paulo

# Tokens que os sistemas externos enviam no header X-Webhook-Token.
# Em produção, venham de um cofre/variável de ambiente.
banco.webhook.token=${BANCO_WEBHOOK_TOKEN:token-banco-local}
emissor.webhook.token=${EMISSOR_WEBHOOK_TOKEN:token-emissor-local}
