quarkus.http.port=8081

# =============================== banco de dados: Oracle em todos os profiles ===============================
quarkus.datasource.db-kind=oracle

# dev e test: sem URL configurada, o Quarkus Dev Services sobe um Oracle em container (exige Docker) e
# injeta URL/usuário/senha sozinho. Para usar um Oracle já existente, defina as variáveis
# QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME e QUARKUS_DATASOURCE_PASSWORD.
# Imagem com versão fixa, do GitHub Container Registry (o autor publica lá também; evita o limite do Docker Hub).
quarkus.datasource.devservices.image-name=ghcr.io/gvenzl/oracle-free:23.26.2-slim-faststart
%dev,test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# prod: credenciais vêm do ambiente/cofre. O esquema é versionado por migração (ex.: Flyway), nunca gerado
# pelo Hibernate em produção.
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.hibernate-orm.schema-management.strategy=none

# Testes: contam as consultas SQL (garante que a listagem não faz N+1)
%test.quarkus.hibernate-orm.statistics=true
# @QuarkusIntegrationTest (jar empacotado) roda no profile test: mesmo Oracle do Dev Services, não o de produção
quarkus.test.integration-test-profile=test

# =============================== negócio ===============================
# Fuso do negócio: define o que é "hoje" (não depende do fuso do servidor)
pagamento.fuso-horario=America/Sao_Paulo

# Token que o banco envia no header X-Webhook-Token.
# Em produção, venha de um cofre/variável de ambiente.
banco.webhook.token=${BANCO_WEBHOOK_TOKEN:token-banco-local}
