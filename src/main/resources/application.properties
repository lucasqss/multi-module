quarkus.http.port=8081
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:boleto;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Fuso do negócio: define o que é "hoje" nas regras de vencimento/pagamento (não depende do fuso do servidor)
boleto.fuso-horario=America/Sao_Paulo

# Regras de negócio parametrizáveis (lidas pelos use cases e entregues ao domínio no candidato das regras)
boleto.prazo-maximo-vencimento-dias=60

# Token que o sistema externo de pagamentos envia no header X-Webhook-Token.
# Em produção, venha de um cofre/variável de ambiente: PAGAMENTOS_WEBHOOK_TOKEN
pagamentos.webhook.token=${PAGAMENTOS_WEBHOOK_TOKEN:token-local-de-desenvolvimento}
